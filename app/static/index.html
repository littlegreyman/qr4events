<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f5597">
  <title>活动登记助手</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand-mark">签</div>
      <div>
        <div class="brand-text">活动报名与签到</div>
        <div class="brand-sub">一个二维码，报名与报到都可以</div>
      </div>
    </div>

    <div class="card">
      <h1>活动报名与扫码签到</h1>
      <p class="muted">面向线下活动的轻量登记工具：同一个二维码，报名期用于报名，报到时用于现场签到。用微信、飞书、钉钉或系统相机扫码，打开的都是这一个网页。</p>
      <div class="divider"></div>
      <p>组织者登录后创建活动、下载二维码、查看报名与报到明细；参与者无需安装任何应用，扫码后按页面提示操作即可。</p>
      <div class="btn-row">
        <a class="btn" href="/admin">组织者登录</a>
      </div>
    </div>

    <div class="card">
      <h2>参与者如何使用</h2>
      <p>请扫描活动组织者提供的二维码进入对应活动页面。若尚未拿到二维码，本页面不提供报名入口。</p>
      <p class="tiny">页面不会要求平台账号登录，不加载任何第三方 SDK，也不会跳转到其他网址。</p>
    </div>

    <div class="footer">
      <a href="/privacy">隐私政策</a><br>
      <span id="filing-line"></span>
    </div>
  </div>
  <script src="/static/filing.js"></script>
</body>
</html>
